label = { en = "Month range", ja = "月の範囲", de = "Monatsbereich", fr = "Plage", es = "Intervalo", pt = "Intervalo", it = "Intervallo", nl = "Bereik", sv = "Intervall", ru = "Диапазон", tr = "Aralık", ar = "النطاق", zh = "月份范围", ko = "월 범위", hi = "सीमा", vi = "Phạm vi" }
