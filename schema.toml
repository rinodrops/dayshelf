label = { en = "Sync folder", ja = "同期フォルダ", de = "Sync-Ordner", fr = "Dossier", es = "Carpeta", pt = "Pasta", it = "Cartella", nl = "Map", sv = "Mapp", ru = "Папка", tr = "Klasör", ar = "المجلد", zh = "同步文件夹", ko = "동기화 폴더", hi = "फ़ोल्डर", vi = "Thư mục" }
