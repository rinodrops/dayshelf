[package]
name = "dayshelf"
version = "0.1.0"
edition = "2021"
description = "Day cards that count down to a date and count up from one"
license = "MIT"

# Release builds strip debug info by default. On macOS that mis-aligns
# proc-macro dylibs such as zerocopy_derive, and rustc then reports
# that the crate cannot be found.
[profile.release]
strip = "none"

[dependencies]
directories = "6"
notify = "6"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
toml = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
whichlang = "0.1.1"
sys-locale = "0.3.2"
