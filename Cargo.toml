[package]
name = "dayshelf"
version = "0.1.0"
edition = "2021"
description = "Day cards that count down to a date and count up from one"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["serde", "v4"] }
